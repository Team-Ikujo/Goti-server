name: Dump Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump all secrets
        run: |
          echo "=== DB CREDS ==="
          echo "DATASOURCE_URL: $(echo '${{ secrets.DATASOURCE_URL }}' | base64)"
          echo "DATASOURCE_USERNAME: $(echo '${{ secrets.DATASOURCE_USERNAME }}' | base64)"
          echo "DATASOURCE_PASSWORD: $(echo '${{ secrets.DATASOURCE_PASSWORD }}' | base64)"
          
          echo "=== JWT ==="
          echo "JWT_SECRET_KEY: $(echo '${{ secrets.JWT_SECRET_KEY }}' | base64)"
          echo "JWT_ACCESS_TIME: $(echo '${{ secrets.JWT_ACCESS_TIME }}' | base64)"
          echo "JWT_REFRESH_TIME: $(echo '${{ secrets.JWT_REFRESH_TIME }}' | base64)"
          echo "JWT_SOCIAL_VERIFY_TIME: $(echo '${{ secrets.JWT_SOCIAL_VERIFY_TIME }}' | base64)"
          
          echo "=== OAUTH KAKAO ==="
          echo "KAKAO_CLIENT: $(echo '${{ secrets.KAKAO_CLIENT }}' | base64)"
          echo "KAKAO_SECRET: $(echo '${{ secrets.KAKAO_SECRET }}' | base64)"
          echo "KAKAO_REDIRECT_URI: $(echo '${{ secrets.KAKAO_REDIRECT_URI }}' | base64)"
          
          echo "=== OAUTH NAVER ==="
          echo "NAVER_CLIENT: $(echo '${{ secrets.NAVER_CLIENT }}' | base64)"
          echo "NAVER_SECRET: $(echo '${{ secrets.NAVER_SECRET }}' | base64)"
          echo "NAVER_REDIRECT_URI: $(echo '${{ secrets.NAVER_REDIRECT_URI }}' | base64)"
          
          echo "=== OAUTH GOOGLE ==="
          echo "GOOGLE_CLIENT: $(echo '${{ secrets.GOOGLE_CLIENT }}' | base64)"
          echo "GOOGLE_SECRET: $(echo '${{ secrets.GOOGLE_SECRET }}' | base64)"
          echo "GOOGLE_REDIRECT_URI: $(echo '${{ secrets.GOOGLE_REDIRECT_URI }}' | base64)"
          
          echo "=== SMS ==="
          echo "SMS_API_KEY: $(echo '${{ secrets.SMS_API_KEY }}' | base64)"
          echo "SMS_API_SECRET: $(echo '${{ secrets.SMS_API_SECRET }}' | base64)"
          echo "SMS_API_SENDER: $(echo '${{ secrets.SMS_API_SENDER }}' | base64)"
          
          echo "=== HARBOR ==="
          echo "HARBOR_REGISTRY: $(echo '${{ secrets.HARBOR_REGISTRY }}' | base64)"
          echo "HARBOR_USERNAME: $(echo '${{ secrets.HARBOR_USERNAME }}' | base64)"
          echo "HARBOR_PASSWORD: $(echo '${{ secrets.HARBOR_PASSWORD }}' | base64)"
          
          echo "=== AWS ==="
          echo "AWS_ROLE_ARN: $(echo '${{ secrets.AWS_ROLE_ARN }}' | base64)"
          
          echo "=== GITHUB ==="
          echo "GH_PAT: $(echo '${{ secrets.GH_PAT }}' | base64)"
          echo "GOTI_K8S_DISPATCH_TOKEN: $(echo '${{ secrets.GOTI_K8S_DISPATCH_TOKEN }}' | base64)"
